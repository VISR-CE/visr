# Plain-language text for the codes the sheet keeps. The page shows these; the sheet and CSV keep the codes.

[exact]
"console-unavailable" = "The app has no frame-time readout we could capture."
"not measured on this device" = "Not run on this device."
"no uncapped 2560×1920 matched-stock measurement" = "Only measured with the frame cap on, at another size or with other settings."
"no uncapped matched-stock measurement" = "Only measured with the frame cap on or with other settings."
"no measurement at the display rate" = "Only measured with other frame-rate or quality settings."
"CPU and GPU time per frame not reported" = "Not reported: this build reports neither CPU nor GPU time per frame."
"not measured yet" = "Not run on this device yet."
"no unattended console" = "This port has no way to start this suite without a person at the keyboard."
"no frames in the trace" = "The timing trace held no frames for this window."
"engine assertion (terminal.c:413)" = "The game halts on an engine assertion during this window."
"engine assertion (data.c:412)" = "The game halts on an engine assertion when the match starts."
"co-op level did not start" = "The two-player level did not start without a person at the keyboard."
"the game reverted to a checkpoint in every round" = "The game reverted to a checkpoint in every round."
"not reachable: no console" = "The app has no console a script can drive, so this suite cannot be started."
"split screen has no stereo view on Vision Pro" = "Split-screen co-op is drawn flat, not in stereo, so the headset shows no presented frames for it: the game keeps its flat render path whenever there is more than one player window."
"no window on tvOS" = "The release's tvOS app starts and loads a level but cannot draw: its window creation fails on tvOS (SDL reports that OpenGL support is not available in the uikit video driver) and the engine runs without a window, so no frame is ever presented and frame time cannot be measured."
"does not build for tvOS" = "The tvOS app cannot be built from the source as its own instructions describe: the build stops with a compile error, because the game's networking code includes a macOS-only CoreGraphics header that the tvOS SDK does not have."
"does not run on Apple TV HD: ANGLE Metal has no ES3 configuration" = "The tvOS app builds and starts on the Apple TV HD but stops at a dialog, \"ANGLE Metal has no ES3 configuration\": its OpenGL ES layer (ANGLE on Metal) cannot create an ES 3 context on this device, so no frame is ever drawn."
"permission-denied" = "The system did not allow the measurement."
"frame rate pinned to the display rate" = "The app is locked to the display's 60 Hz refresh even with its frame cap and vsync off, so its uncapped speed cannot be measured on this display."
"match did not start" = "The hosted match did not start without a person at the keyboard."
"engine assertion (sound_dsound.h:35)" = "The game halts on a sound engine assertion during this window."
"no tvOS development profile for this port" = "The release ships a tvOS app, but no tvOS development profile for it lists this Apple TV, so it cannot be installed here, and its timing hook that records frame times exists only for iOS."
"second split-screen player never joined" = "The host never had both local split-screen players in any of the three rounds, so the co-op window could not be measured."

[patterns]
# {suite} and {suites} are filled from the code.
no_suite_data = "The {suite} suite has not been run for this build."
missing_suites = "No overall result: missing {suites}."
partial_suite = "The {suite} suite is only measured for part of its windows (missing {windows})."
