# Sampling windows of the cross-port suite. A window key names one measured stretch of a level; the harness
# starts the level, runs the window's kind, and records the key as the run's `scenario`.
#
# kind = "opening":  the level's first minutes, no input. Warm up, then sample `sample_s`.
# kind = "battle":   console commands place the player and the encounters; warm up `warmup_s` after the
#                    commands, then sample `sample_s`. `fingerprints` are read at the end.
# kind = "cutscene": call `script` from the console; the sample runs from the call to its print (or to the
#                    start tick plus `expected_ticks` on ports whose console prints nothing).
# kind = "bot":      a scripted player (`test_input`) for `ticks` game ticks from `start_tick`.
#
# `reference_shot` names the qualification image kept beside the mid-window screenshot.
# `shot`:           the frame the public page shows for the window, taken by a shots-only run (no timing): the
#                    game plays to `tick` (battle commands and cutscene scripts fire in-game at `start`, or at the
#                    window's `start_tick`), freezes with `game_speed 0`, and every port loads the same `camera`
#                    pose (position, forward, up, field of view, as `debug_camera_save` writes it). The pose is
#                    harvested from VISR's own view at the tick; until then the table has no `camera`.

[c10]
suite = "campaign"
map = "c10"
kind = "opening"
warmup_s = 15
sample_s = 60
reference_shot = "c10-opening"

[c10.shot]
tick = 1800

[b30]
suite = "campaign"
map = "b30"
kind = "opening"
warmup_s = 15
sample_s = 60
reference_shot = "b30-opening"

[b30.shot]
tick = 1800

[a50-hangar]
suite = "combat"
map = "a50"
kind = "battle"
commands = [
  "(switch_bsp 2)",
  "(object_teleport (unit (list_get (players) 0)) extraction_dropship_base)",
  "(ai_place hangar_cov_first_floor)",
  "(ai_place hangar_cov_second_floor)",
  "(ai_place hangar_cov_third_floor)",
  "(ai_place hangar_marines)",
  "(ai_place hangar_marines)",
  "(ai_magically_see_encounter hangar_cov_first_floor hangar_marines)",
  "(ai_magically_see_encounter hangar_marines hangar_cov_first_floor)",
  "(ai_magically_see_players hangar_cov_second_floor)",
  "(ai_magically_see_players hangar_cov_third_floor)",
]
encounters = ["hangar_cov_first_floor", "hangar_cov_second_floor", "hangar_cov_third_floor", "hangar_marines"]
warmup_s = 15
sample_s = 60
fingerprints = [
  "(ai_living_count hangar_cov_first_floor)",
  "(ai_living_count hangar_cov_second_floor)",
  "(ai_living_count hangar_cov_third_floor)",
  "(ai_living_count hangar_marines)",
  "(unit_get_health (unit (list_get (players) 0)))",
]
reference_shot = "a50-hangar"

[a50-hangar.shot]
start = 600
tick = 1050

[b40-exta]
suite = "combat"
map = "b40"
kind = "battle"
commands = [
  "(switch_bsp 0)",
  "(object_teleport (unit (list_get (players) 0)) ext_a_dropship_a_flag)",
  "(ai_place ext_a_area_a_cov)",
  "(ai_place ext_a_area_a_marines)",
  "(ai_magically_see_encounter ext_a_area_a_cov ext_a_area_a_marines)",
  "(ai_magically_see_encounter ext_a_area_a_marines ext_a_area_a_cov)",
]
encounters = ["ext_a_area_a_cov", "ext_a_area_a_marines"]
warmup_s = 15
sample_s = 60
fingerprints = [
  "(ai_living_count ext_a_area_a_cov)",
  "(ai_living_count ext_a_area_a_marines)",
  "(unit_get_health (unit (list_get (players) 0)))",
]
reference_shot = "b40-exta"

[b40-exta.shot]
start = 600
tick = 1050

[b30-bot]
suite = "combat"
map = "b30"
kind = "bot"
test_input = "bot:1"
start_tick = 900
ticks = 1800
fingerprints = [
  "(game_time)",
  "(unit_get_health (unit (list_get (players) 0)))",
  "(unit_get_total_grenade_count (unit (list_get (players) 0)))",
]
reference_shot = "b30-bot"

[b30-bot.shot]
tick = 1800

[x70-bridge]
suite = "cutscenes"
map = "d40"
kind = "cutscene"
script = "x70_bridge"
expected_ticks = 3790
# the level's own opening cinematic (cutscene_insertion) runs from tick 2 to about tick 2400 and shares the cinematic
# state and camera with this script; called inside it, only the script's first half shows (the camera returns to the
# player when the opening ends). The script starts once game time passes this tick, after the opening.
start_tick = 2500
reference_shot = "x70-bridge"

[x70-bridge.shot]
tick = 3700

[cutscene-rescue]
suite = "cutscenes"
map = "a50"
kind = "cutscene"
script = "cutscene_rescue"
expected_ticks = 3180
reference_shot = "cutscene-rescue"

[cutscene-rescue.shot]
start = 900
tick = 2490

# kind = "match":    a hosted Slayer match on a multiplayer map: the host starts the game by itself; `players` local
#                    players, played by the scripted bot `test_input`. Warm up after player readiness, then sample.
# kind = "coop":     the campaign level hosted as a local co-op game with `players` split-screen players and no input;
#                    enemy scaling is set to static 1x where the port has the option.

[mp-chillout]
suite = "multiplayer"
map = "chillout"
kind = "match"
players = 1
test_input = "bot:1"
warmup_s = 15
sample_s = 60
fingerprints = [
  "(list_count (players))",
  "(game_time)",
  "(unit_get_health (unit (list_get (players) 0)))",
]
reference_shot = "mp-chillout"

[mp-chillout.shot]
tick = 900

