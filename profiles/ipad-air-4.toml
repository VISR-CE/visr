# iPad13,1 (iPad Air 4th generation, A14, 60 Hz): 60 frames a second at 1080 lines and full quality with 1.5x enemies, tier 4
# of the ladder (the highest a 60 Hz display allows). The October 2026 sweep held tier 3 and fell just short at 1.5x (99.49 to
# 99.83% on time); the November 23 Game Mode build holds it (99.83% in both rounds on a10, 100% on d40). Before this profile
# the model inherited the A10X iPad's reduced 720-line recipe.
#:schema ../port/settings/profile.schema.json
schema = 1
name = "iPad Air (4th generation)"
kind = "model"
status = "provisional"

[match]
platform = "ios"
models = ["iPad13,1"]

[display]
scene_precision = 16
upscaled_textures = true
frame_rate = "60"
render_height = 1080
anisotropic_filtering = 16
shadow_map_size = 128
model_lod = "max"
dynamic_resolution = true

[variable.display]
scene_precision = 8
frames_in_flight_at_30 = "1"

[network]
player_capacity = 64
full_rate_players = 64

[evidence."display.frame_rate"]
basis = "measured"
why = "Presented runs on a Game Mode build (thermal state 0, 1080 lines, 60 frames a second, within one frame period): a10-heroic 1x 99.90%, a10-heroic with 1.5x enemies 99.83% and 99.83% (two rounds), d40-maw-fight 1x 100%, d40 with 1.5x enemies 100% (one valid round; a second run failed to report). That holds tier 4 (60 / 1080 / 1.5x), the highest tier a 60 Hz display allows. The October sweep had 99.78% (a10) and 99.86% (d40) at 1x and 99.63% and 99.49% at 1.5x. Hold: after the first second of the window, at least 99.5% of frames within one frame period."
source = "VISR Game Mode tier check, build 20261123.014559 (main a9e7b3c07), presented, a10-heroic, a10-heroic-x1-5, d40-maw-fight and d40-x1-5 windows, 2026-11-23; October rounds from VISR settings sweep build 20261024.122832"

[evidence."variable.display.frames_in_flight_at_30"]
basis = "measured"
why = "The profile runs 60 and reaches 30 only in a game above 64 players and in 30 fps scene classes. No arm ran there at 30. In forced 30 arms at 16 and 64 players one frame in flight cut the time from the controller read to the screen from 97 to 98 ms to 64 to 65 ms with no failed GPU buffers, at 29.9 frames a second shown against 30.5 with two in flight (a 2% lower rate). The nearest game it applies to, 128 players below rate under the 60 cap, showed two in flight at 35.4 frames a second and 65.2 / 81.7 ms (p50 / p95) against one in flight at 29.9 frames a second and 64.7 / 65.0 ms, a gain of about 17 ms at p95 and none at p50. On-time frames were not measured at 128 players. Only the variable workload takes it: no campaign arm was measured, and a GPU-bound case can lose frames with one in flight, so the predictable workload keeps two."
source = "VISR input latency matrix, build 20261121.214648 (main 049a67d6c with debug logging added), presented, simulated Blood Gulch game, 45 s windows after a 15 s lead, 2026-11-21 to 2026-11-22"

[evidence."display.render_height"]
basis = "measured"
why = "1080 lines held at 1x and 1.5x enemies (tier 4); the native 1640 lines were not measured."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.anisotropic_filtering"]
basis = "measured"
why = "16x against 2x cost 0.08 to 0.10 ms a frame at 900 lines."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.shadow_map_size"]
basis = "assumed"
why = "All shadow maps are 128 texels except offline renders; the visual gain above 128 is small and the cost is large in big games."
source = "Project policy, 2026-11-04"

[evidence."display.model_lod"]
basis = "measured"
why = "Maximum against automatic model detail cost 0.05 to 0.06 ms a frame at 900 lines."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."network.player_capacity"]
basis = "measured"
why = "The current-build capacity ladder holds 64 players at 30 frames a second and 540 lines: median on-time frames are 99.985% on Blood Gulch and 100% on Sidewinder, two presented rounds each. At 128, Blood Gulch falls to 99.235% and Sidewinder to 99.97%. All lower measured Blood Gulch rungs hold. This ladder used 512 shadows, 2x filtering, automatic model detail, Xbox effects and lowest clutter detail; it did not test the cheapest 128 shadows. 64 is the highest passing count on both maps in that measured ladder, separate from the threshold at the variable profile's settings."
source = "VISR presented capacity ladder, main e77a24957, build 20261029.192128, 2026-10-30 to 2026-10-31"

[evidence."display.dynamic_resolution"]
basis = "assumed"
why = "The same A14 GPU family as the iPhone 12 Pro, where dynamic resolution ran with stage timing and cost nothing at the ceiling; on the A10X and M1 it held 60 frames a second in the Maw fight where the fixed resolution did not."
source = "VISR presented benchmark runs on the iPhone 12 Pro, iPad Pro 12.9-inch (2nd generation) and iPad Pro M1, 2026-10-25"

[evidence."network.full_rate_players"]
basis = "measured"
why = "At 60 frames a second, the real variable settings (1080-line ceiling, dynamic resolution down to 540, 128 shadows, 16x filtering, maximum model detail and full effects) hold every Blood Gulch rung through 64 players. At 64, two valid presented rounds put 99.93% and 99.89% of frames on time, median 99.91%. At 128 the median is 49.225%, below the 99.5% bar. Sidewinder confirms 64 at 99.97% and 99.93%, median 99.95%. 64 is the largest passing ladder count confirmed on both maps. Rechecked on a Game Mode build (main a9e7b3c07, 2026-11-23, dynamic resolution on, 1080 down to about 640 lines): Blood Gulch with 64 players 99.55% and 99.81%, so 64 stays."
source = "VISR toobig sweep, build 20261029.192128 (main e77a24957), Metal, Blood Gulch and Sidewinder, 2026-10-31 to 2026-11-01; Game Mode recheck build 20261123.014559"

[evidence."display.upscaled_textures"]
basis = "assumed"
why = "Above 720 lines, upscaled textures add visible detail. The iPhone and iPad class profile turns them off for the weakest devices, so this model sets them on."

[evidence."display.scene_precision"]
basis = "measured"
why = "At this profile's 60 frames a second and 1080 lines, the 16-bit scene held 99.90 to 99.93% of frames on time against 99.87 to 99.90% at 8 bits, with lines unchanged at 1080. The GPU time rose 2.2 ms at the median (7.9 to 8.0 ms against 10.1 to 10.2 ms) and 0.3 ms at the 95th percentile (16.3 to 16.6 ms against 16.7 to 16.9 ms), and the peak footprint 18 MB. Thermal state was fair in every round, 8 and 16 bits alike."
source = "VISR scene precision pairs, main 3220916d5 (build 20261124.085457), a10-heroic campaign window, the profile as shipped with display.scene_precision 8 and 16 interleaved (8, 16, 8, 16), bench/latency-matrix.py, presented, debug.gpu_stats, 2026-11-24"

[evidence."variable.display.scene_precision"]
basis = "assumed"
why = "Multiplayer and the other variable workloads were not measured at 16 bits (larger games, wider dynamic resolution), so they keep the 8-bit scene until a pair there shows the cost."
source = "VISR scene precision pairs, main 3220916d5 (build 20261124.085457), a10-heroic campaign window, the profile as shipped with display.scene_precision 8 and 16 interleaved (8, 16, 8, 16), bench/latency-matrix.py, presented, debug.gpu_stats, 2026-11-24"
