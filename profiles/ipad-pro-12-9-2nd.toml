# iPad7,2 (A10X, 120 Hz): 30 frames a second at 900 lines and full quality but the game's 128-pixel shadows, from the October 2026 settings sweep.
# 60 does not hold at 900 lines even with every setting at its cheapest (95.4% of a10 frames on time), and 120 holds
# nowhere, so the profile takes the ladder's floor rate with the lines and quality that rate affords: at 30, 900 lines
# held with 1.5x and 2x enemies and every quality setting, and a presented d40 run at 30 showed every frame on time.
# The earlier recipe (720 lines, reduced quality, the display's 120) ran 71 to 82 frames a second, between refreshes.
#:schema ../port/settings/profile.schema.json
schema = 1
name = "iPad Pro 12.9-inch (2nd generation)"
kind = "model"
status = "provisional"

[match]
platform = "ios"
models = ["iPad7,2"]

[display]
upscaled_textures = true
frame_rate = "30"
render_height = 900
anisotropic_filtering = 16
shadow_map_size = 128
model_lod = "max"
dynamic_resolution = true

[variable.display]
effect_limits = "xbox"
frames_in_flight_at_30 = "1"
encode_thread = "thread"

[network]
player_capacity = 64
full_rate_players = 16

[evidence."display.frame_rate"]
basis = "measured"
why = "At 900 lines and maximum quality 84.6% (a10) and 83.4% (d40) of frames were within 16.7 ms; with every setting at its cheapest 95.4% and 95.5%. At 1080 lines 64.3% and 67.1%. At 30, 900 lines held 99.89% and 99.95% at 1x and 99.86 to 100% at 1.5x enemies, and the presented d40 run at 30 showed all 2,280 frames on time. Hold: after the first second of the window, at least 99.5% of frames within one frame period and at most 0.5% over 1.5 periods, for the median round of every workload."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."variable.display.frames_in_flight_at_30"]
basis = "measured"
why = "At 64 players under the 30 cap (soft particles off, late start off, four runs: three repeats and the matching arm of the first rerun, no failed GPU buffers in any), one frame in flight cut the time from the controller read to the screen from 99 ms to 66 ms at p50 and from 105 to 107 ms to 70 to 74 ms at p95. Report frame rate was 26.5 to 28.1 (mean 27.3) with one in flight against 26.4 to 27.3 (mean 26.9) with two, and on-time frames 0.908 to 0.972 (mean 0.942) against 0.940 to 0.965 (mean 0.951): the 0.009 gap in the means is inside the run-to-run spread. The device holds neither setting at 64 players. At 16 players one frame in flight cut 99.4 to 66.0 ms (p95 103.5 to 69.9 ms) at 30.1 frames a second shown either way. Only the variable workload (multiplayer, co-op, split screen, more enemies) takes it: campaign was not in this matrix, its 99.9% on time at 30 is unverified with one in flight, and a GPU-bound case can lose frames with one in flight (the iPhone Duo did), so the predictable workload keeps two. A campaign pair can widen it."
source = "VISR input latency matrix, build 20261121.214648 (main 049a67d6c with debug logging added), presented, simulated Blood Gulch game, 45 s windows after a 15 s lead, 2026-11-21 to 2026-11-22"

[evidence."variable.display.encode_thread"]
basis = "measured"
why = "Variable workload only. Same build, thread against off, interleaved in one session (six campaign rounds, four 16-player rounds, 30 frames a second): in multiplayer the thread showed input sooner, controller to shown 57.3 ms at the median against 64.9 ms off (32 windows each), on time 99.55% and 99.93% with it, 99.85% and 99.93% off; at 128 players (debug logging, soft particles off, dynamic resolution off) 20.0 and 21.0 frames a second with shown 65.9 and 99.1 ms, against 17.7 and 18.0 with shown 99.2 ms off. A second session on 19747c3f1 (signed build, two off and two on rounds interleaved, 16 players, 30 frames a second) did not repeat that gain: controller to shown 57.4 and 57.6 ms off against 65.8 and 57.5 ms with the thread, so equal in one pair and about one display step longer in the other; frames a second were 29.7 to 29.8 in all four rounds. The 16-player latency is therefore equal or within one display step either way, and the case for the thread rests on the 128-player rates above. In the single-player campaign the thread did not show input sooner (57.0 ms at the median against 48.9 ms off, 72 windows each, a display refresh step later in about half the windows), so the profile does not set it there and campaign keeps off. An earlier campaign pair read 65.7 ms with the thread against 99.2 ms off; the same device read 48.9 ms off later with the same code, so only comparisons inside one session count. Unmeasured: dynamic resolution on in the thread arm, and the A12X and A12Z iPad Pros and the A10X siblings (iPad7,1, iPad7,3, iPad7,4; the 10.5-inch iPad Pro), which take this profile as their fallback and so get the thread for multiplayer without a measurement of their own (accepted for the first release that carries it; a profile of their own replaces this once they are measured)."
source = "VISR perf/a10x-encode-thread, signed builds of 13ef6962a and 19747c3f1, iPad Pro 12.9 (2nd generation), bench/latency-matrix.py and device-mp-ab.py, presented, debug.latency_log, 2026-11-23; 128-player pairs from perf/metal-encode-thread builds de74777c6 and 807307f1a (landed as main 18798b2dd)"

[evidence."display.render_height"]
basis = "measured"
why = "At 30 frames a second 1080 lines held at 1x (99.86% and 99.98%, two rounds) but not at 1.5x (a10 98.06%); 900 lines held at 1.5x and 2x, so 900 keeps headroom for busier scenes."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.anisotropic_filtering"]
basis = "measured"
why = "At 30 frames a second and 900 lines every filtering step held 99.9% or more on time; 16x costs 0.4 to 0.5 ms a frame over 2x out of the 33.3 ms budget."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.shadow_map_size"]
basis = "measured"
why = "At 64 players on Blood Gulch the GPU took 28 to 30 ms a frame at 128-pixel shadows, 33 to 37 at 256 and 53 to 54 at 512, and only 128 came near holding 30 frames a second (99.0% and 99.6% of frames on time; 256: 84 to 96%; 512: 31 to 34%). In a10's mess hall 512 to 128 alone took the GPU from 17.67 to 13.72 ms. Shadow detail is the first setting lowered before a tier (profiles/README.md, Targets): above 128 the game's shadows look little better and cost the most on these GPUs."
source = "VISR shadow map size runs at 128, 256 and 512, mp-bloodgulch-64 on the batched-blur build, 30 s windows, 2026-10-25; settings sweep a10-mess-hall, build 20261024.122832 (0.5.0)"

[evidence."display.model_lod"]
basis = "measured"
why = "Automatic model detail changed the frame by -0.13 to +0.05 ms against maximum detail at 900 lines, nothing a 30 frames a second budget needs."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.dynamic_resolution"]
basis = "measured"
why = "Presented d40-maw-fight at 1080 lines and 60 frames a second: 76.1% and 92.5% of frames on time with dynamic resolution off, 99.8% and 99.9% with it on (540 to 1080 lines, median 800); a10-heroic 99.25% against 99.83%. At this profile's 900 lines and 30 frames a second it is a safety net for heavier scenes than the windows measured."
source = "VISR presented benchmark runs, builds 20261025.132032 and 20261025.183442, 2026-10-25"

[scene.menu.display]
render_height = 0
frame_rate = "60"

[evidence."scene.menu.display.render_height"]
basis = "assumed"
why = "Keep the previous native-size menu; the sweep did not measure menus."

[evidence."scene.menu.display.frame_rate"]
basis = "assumed"
why = "Menus run at 60 as before the gameplay cap; the sweep did not measure menus."

[scene.cutscene.display]
render_height = 0

[evidence."scene.cutscene.display.render_height"]
basis = "assumed"
why = "Keep the previous native-size cutscene rendering until a cutscene is measured on this model."

[evidence."network.player_capacity"]
basis = "measured"
why = "The current-build capacity ladder holds 64 players at 30 frames a second, minimum settings and 540 lines: median on-time frames are 99.955% on Blood Gulch and 100% on Sidewinder, two presented rounds each. At 128, Blood Gulch falls to 96.11% and Sidewinder to 67.315%. All lower measured Blood Gulch rungs hold. The highest count that holds on both maps is 64. This minimum-settings capacity is separate from the threshold at the variable profile's settings."
source = "VISR presented capacity ladder, main e77a24957, build 20261029.192128, 2026-10-30 to 2026-10-31"

[evidence."network.full_rate_players"]
basis = "measured"
why = "At 60 frames a second, the real variable settings (900-line ceiling, dynamic resolution down to 540, 128 shadows, 16x filtering, maximum model detail and full effects) hold 16 players on Blood Gulch: 99.94% and 99.89% on time, median 99.915%. The 24-player rung fails at 98.81% and the 32-player probe at 97.17%. Sidewinder confirms 16 at 99.94% and 99.99%, median 99.965%. Each decision uses two valid presented rounds at the 99.5% bar. Earlier thermal-invalid attempts are excluded; the valid confirmation pair followed an extended cooldown. 16 is the largest passing ladder count confirmed on both maps."
source = "VISR toobig sweep, build 20261029.192128 (main e77a24957), Metal, Blood Gulch and Sidewinder, 2026-10-31 to 2026-11-01"

[evidence."display.upscaled_textures"]
basis = "assumed"
why = "Above 720 lines, upscaled textures add visible detail. The iPhone and iPad class profile turns them off for the weakest devices, so this model sets them on."

[evidence."variable.display.effect_limits"]
basis = "measured"
why = "In a 128-player Blood Gulch fight the Xbox's decal set held 19.4 frames a second where the raised set held 17.2 (three interleaved rounds each): 7.0 ms less CPU a frame, 3.9 of it in the simulation's decal allocation and 3.2 in drawing, and 3.0 ms less GPU. The raised set keeps about four times the marks; a small game fills neither. Split screen gets the Xbox's share of an effect's particles as well, as on the Xbox."
source = "VISR main 1a41b6f59 with debug.verify_once_a_tick on, iPad Pro 12.9 (2nd generation), cost:mp128-bloodgulch-1029-p60 presented, 2026-11-20"
