schema = 1
name = "iPad Pro (M4)"
kind = "model"
status = "provisional"

[match]
platform = "ios"
models = ["iPad16,3", "iPad16,4", "iPad16,5", "iPad16,6"]

[display]
upscaled_textures = true
frame_rate = "120"
render_height = 0
dynamic_resolution = true
dynamic_resolution_floor = 1080
anisotropic_filtering = 16
shadow_map_size = 128
effect_resolution = "half"
upscaler = "metalfx"

[variable.display]

[network]
player_capacity = 128
full_rate_players = 64

[evidence."display.frame_rate"]
basis = "measured"
why = "A tester's 0.6.4 report ran 20 gameplay runs on an iPad16,3 (11-inch, 8 GB) at 120 frames a second and native 1668 lines across a10, a50, b30, b40, c20, c40 and d40, including 1.5x and 2x enemies and d40-maw-fight: 119.8 to 120.0 fps, 99.90% to 100% of frames on time, no stalls, thermal state 0 throughout. GPU time was 4.7 to 6.4 ms at the median (tightest: b40 at 1.5x) and 6.1 to 6.9 ms at the 95th percentile in an 8.3 ms frame; 99th percentile up to 12.9 ms. Earlier 0.6.3 report VBVS7L4Y measured the same tier at 1080 lines."
source = "VISR 0.6.4 benchmark report 5R2BP4EV, iPad16,3, presented gameplay runs, build 20261029.143236, 2026-10-29; VISR 0.6.3 benchmark report VBVS7L4Y, 2026-10-28"

[evidence."display.render_height"]
basis = "measured"
why = "Native (0) is the ceiling of dynamic resolution, 1668 lines on the 11-inch and 2064 on the 13-inch. On the 11-inch the device held 120 frames a second at the 1668-line ceiling in all 20 runs (see display.frame_rate), including 2x enemies. The 13-inch panel was not measured."
source = "VISR 0.6.4 benchmark report 5R2BP4EV, iPad16,3, presented gameplay runs, build 20261029.143236, 2026-10-29; Steve, 2026-10-28"

[evidence."display.dynamic_resolution"]
basis = "measured"
why = "Dynamic resolution is on as the M1 iPad Pro's profile has it, where presented d40-maw-fight runs at 1080 and 1600 lines and 120 frames a second held 99.97% and 99.96% of frames on time with short drops of up to three levels and recovery within a second. On this device all 20 runs of the 0.6.4 report stayed at the 1668-line ceiling with no level changes, so the planner never had to lower the resolution; it stays on as a safety net for heavier workloads."
source = "VISR 0.6.4 benchmark report 5R2BP4EV, iPad16,3, presented gameplay runs, build 20261029.143236, 2026-10-29; VISR presented benchmark runs, build 20261025.132032, 2026-10-25"

[evidence."display.dynamic_resolution_floor"]
basis = "assumed"
why = "1080 lines is the ladder's ideal tier and the resolution the device held at 120 frames a second with GPU headroom; Steve chose it as the floor on 2026-10-28. It is above half of either panel's native lines, as the floor requires. Not exercised: the 0.6.4 runs never dropped below native, so the range below 1668 is unmeasured on this device."
source = "Steve, 2026-10-28; VISR 0.6.4 benchmark report 5R2BP4EV, iPad16,3, presented gameplay runs, build 20261029.143236, 2026-10-29"

[evidence."display.anisotropic_filtering"]
basis = "measured"
why = "16x against off cost 0.1 ms of GPU time a frame."
source = "iPad settings sweep, a10 benchmark at 3180x2384, 2026-10-03"

[evidence."display.shadow_map_size"]
basis = "assumed"
why = "Steve 2026-11-04: all shadow maps are 128 texels except offline renders; the visual gain above 128 is small and the cost is large in big games."
source = "Steve, 2026-11-04"

[evidence."display.effect_resolution"]
basis = "measured"
why = "On c40's mirror floors, full took GPU time from about 9 ms to 13.7 ms a frame and the frame from 8.3 ms to 13.1."
source = "iPad mirror runs, c40, 2026-10-03"

[evidence."network.player_capacity"]
basis = "inherited"
why = "The nearest measured weaker iPad is the iPad Pro (M1), whose current-build capacity ladder holds 128 players. The older 32-player capacity came from a build before the multiplayer render fixes and is superseded by this conservative inheritance. The M4 has not run the current capacity ladder."
source = "ipad-pro-m1.toml network.player_capacity evidence, main e77a24957, 2026-10-30"

[evidence."display.upscaler"]
basis = "measured"
why = "MetalFX spatial scaling from 1080 lines to the 3180x2384 panel kept every tier held: on time at 60 was 99.98% (d40), 99.93% (a10) and 99.97% (b30) against 99.98%, 99.83% and 100% with bilinear; at 120 it was 99.90% (a10) and 99.75% (d40, the device at thermal state 2) against 99.73% and 99.96%. The scaler adds about 1.0 ms of GPU time a frame (offscreen medians 6.6 against 5.6 ms on a10 and 6.4 against 5.5 on d40). Edges are smoother and detail sharper than the bilinear stretch in same-frame comparisons."
source = "Providence a10-heroic, d40-maw-fight and b30 presented runs, build d290f06fe (20261026.002743), 2026-10-26; offscreen costs from the temporal-aa lane, 2026-10-25"

[evidence."network.full_rate_players"]
basis = "inherited"
why = "Inherit 64 from the nearest measured weaker iPad, the iPad Pro (M1), whose two-round 60-fps Blood Gulch result holds at 64 and fails at 128 on the current build. The M4 has not run this multiplayer ladder at its own variable settings."
source = "ipad-pro-m1.toml network.full_rate_players evidence, main e77a24957, 2026-10-30"

[evidence."display.upscaled_textures"]
basis = "assumed"
why = "Above 720 lines, upscaled textures add visible detail. The iPhone and iPad class profile turns them off for the weakest devices, so this model sets them on."
